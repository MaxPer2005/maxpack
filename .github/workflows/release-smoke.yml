name: Release Smoke

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify. Defaults to the latest release."
        required: false

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release download "${{ steps.resolve.outputs.tag }}" --repo "$REPO" --dir dist --clobber

      - name: Validate release asset set and checksums
        run: python3 scripts/check_release_assets.py dist

      - name: Smoke test Linux CLI binary
        run: |
          chmod +x dist/maxpack-linux-amd64
          ./dist/maxpack-linux-amd64 --version
