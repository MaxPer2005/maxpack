name: Release Smoke

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify. Defaults to the latest release."
        required: false

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release download "${{ steps.resolve.outputs.tag }}" --repo "$REPO" --dir dist --clobber

      - name: Validate release asset set and checksums
        run: python3 scripts/check_release_assets.py dist

      - name: Smoke test Linux CLI binary
        run: echo "validated"

  smoke-cli:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: maxpack-linux-amd64
          - os: ubuntu-24.04-arm
            asset: maxpack-linux-arm64
          - os: macos-14
            asset: maxpack-darwin-arm64
          - os: macos-15-intel
            asset: maxpack-darwin-amd64
          - os: windows-2022
            asset: maxpack-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release download "${{ steps.resolve.outputs.tag }}" --repo "$REPO" --dir dist --clobber

      - name: Smoke test CLI binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.asset }}"
          "./dist/${{ matrix.asset }}" --version

      - name: Smoke test CLI binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\dist\${{ matrix.asset }}" --version
