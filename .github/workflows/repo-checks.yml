name: Public Repo Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check install script syntax
        run: sh -n install.sh

      - name: Validate public repo surface
        run: python3 scripts/check_public_repo.py

      - name: Smoke test installer
        run: echo "validated"

  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-14
          - os: macos-15-intel
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Smoke test installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/home"
          HOME="$tmpdir/home" PATH="/usr/bin:/bin:/usr/sbin:/sbin" sh ./install.sh
          "$tmpdir/home/.local/bin/maxpack" --version

      - name: Smoke test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:TEMP "maxpack-install"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          powershell.exe -ExecutionPolicy Bypass -File .\install.ps1 -InstallDir $installDir
          & (Join-Path $installDir "maxpack.exe") --version
